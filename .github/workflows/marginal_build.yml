name: "Marginal Backend Build and Push"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**"
  pull_request:
    branches: [main]
    paths:
      - "**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/tomato-admin-service:latest

      - name: Trigger Render deploy
        run: |
          curl -X POST "${{ secrets.MARGINAL_RENDER_DEPLOY_HOOK_URL }}"
